<section class="list-product">
  <div class="container">
    <div class="content-info">
      <div class="content-grid-4">
        <div *ngFor="let producto of valorEntradaPadre; let i = index" class="card">
          <h3>{{ producto.title }}</h3>

          <div class="content-img">
            <img [src]="producto.image" alt="imagen del producto" />
          </div>

          <div class="txt">
            <p>{{ producto.descripcion }}</p>
            <p><strong>Categoría:</strong> {{ producto.categoria }}</p>
            <p><strong>Precio:</strong> {{ producto.price }}</p>

            <ion-button *ngIf="!encarrito" (click)="agregadoCarrito(producto)">
              Comprar
            </ion-button>

            <ion-button *ngIf="encarrito" color="danger" (click)="eliminadoCarrito(i)">
              Eliminar
            </ion-button>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
