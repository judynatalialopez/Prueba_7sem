<section class="list-product">
  <div class="container">
    <div class="content-info">
      <div class="content-grid-4">
        <div *ngFor="let producto of valorEntradaPadre" class="card">
          <h3>{{ producto.title }}</h3>
          <div class="content-img">
            <img [src]="producto.image" alt="imagen" />
          </div>
          <div class="txt">
            <p>{{ producto.descripcion }}</p>
            <p><strong>Categoria:</strong> {{ producto.categoria }}</p>
            <p><strong>Precio:</strong> {{ producto.price }}</p>
            
            <button *ngIf="modo === 'categoria'; else botonCarrito" class="comprar" (click)="CompraProduct(producto)">
  Comprar
</button>

<ng-template #botonCarrito>
  <button [class.eliminar]="estaEnCarrito(producto)" (click)="CompraProduct(producto)">
    {{ estaEnCarrito(producto) ? 'Eliminar' : 'Comprar' }}
  </button>
</ng-template>




          </div>

        </div>
      </div>
    </div>
  </div>



</section>
